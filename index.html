<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unser Quiz ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
	<!-- LOGIN -->
	<div id="login">
		<h2 id="loginTitle"></h2>
		<div id="loginText"></div>
		<input id="code" placeholder="DD.MM.YYYY">
		<button onclick="showLogin()">Start</button>
	</div>
	
	<!-- EINLEITUNG -->
    <div id="intro" style="display:none">
        <h1 id="introTitle"></h1>
        <div id="introText"></div>
        <button onclick="startQuiz()">Quiz starten</button>
    </div>

	 <!-- QUIZ -->
	<div id="quiz" style="display:none">
		<h2 id="questionTitle"></h2>
		<div class="progress">
			<div id="bar"></div>
		</div>
		<div id="letters"></div>
		<div class="question-box">
			<div id="questionContext"></div>
			<h2 id="questionText"></h2>
			<div id="questionAnswers"></div>
		</div>
	</div>
	
	<!-- ZUSATZSEITE NACH FRAGE 6 -->
    <div id="middle" style="display:none">
        <h1 id="middleTitle"></h1>
        <div id="middleText"></div>
        <button onclick="continueQuiz()">Weiter</button>
    </div>

    <!-- SCHLUSS -->
    <div id="result" style="display:none">
        <h1 id="resultTitle"></h1>
		<div id="resultText"></div>
    </div>

</div>
<script src="script.js"></script>

</body>
</html>
